<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Repo Canvas — semantic project map</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><i></i><i></i><i></i><span><strong>Repo Canvas</strong><small>живая смысловая карта проекта</small></span></div>
    <div class="telemetry" aria-label="Canvas status">
      <span><small>ОБЛАСТИ</small><strong id="areaValue">0</strong></span>
      <span><small>СУЩНОСТИ</small><strong id="entityValue">0</strong></span>
      <span class="hot"><small>В РАБОТЕ</small><strong id="activeValue">0</strong></span>
      <span id="connectionStatus" class="connection is-online"><i></i><b>онлайн</b></span>
    </div>
  </header>

  <main class="workspace">
    <aside class="left-rail">
      <section class="rail-section project-section">
        <header><b>ПРОЕКТ</b><span id="projectCount">0</span></header>
        <button id="allProject" class="project-all is-active" type="button"><i>∞</i><span><strong>Вся система</strong><small>общая карта</small></span></button>
        <div id="projectTree" class="project-tree"></div>
      </section>

      <section id="passport" class="passport" hidden>
        <button id="closePassport" type="button" aria-label="Закрыть">×</button>
        <small id="passportArea">СУЩНОСТЬ</small>
        <h2 id="passportTitle"></h2>
        <p id="passportPurpose"></p>
        <dl id="passportFacts"></dl>
      </section>

      <section class="rail-section now-section">
        <header><b>СЕЙЧАС</b><span id="nowCount">0</span></header>
        <div id="nowList" class="now-list"></div>
      </section>

      <section class="rail-section latest-section">
        <header><b>ПОСЛЕДНЕЕ</b><span id="lastSync">—</span></header>
        <div id="activityList" class="activity-list"></div>
      </section>
    </aside>

    <section class="canvas-shell">
      <header class="canvas-header">
        <span><small>АРХИТЕКТУРА И ТЕКУЩАЯ РАБОТА</small><h1 id="canvasTitle">Весь проект</h1></span>
        <nav><button id="zoomOut" type="button" aria-label="Уменьшить">−</button><button id="fitView" type="button">Показать всё</button><button id="zoomIn" type="button" aria-label="Увеличить">+</button></nav>
      </header>
      <div id="viewport" class="viewport" aria-label="Semantic repository canvas">
        <div id="world" class="world">
          <div id="areaLayer" class="area-layer"></div>
          <svg id="edgeLayer" class="edge-layer" aria-hidden="true"></svg>
          <div id="entityLayer" class="entity-layer"></div>
          <div id="workLayer" class="work-layer"></div>
        </div>
        <p id="emptyState" class="empty-state">Смысловая карта проекта пока не построена.</p>
        <span class="canvas-hint">тяните фон · колесо меняет масштаб · двойной клик по работе открывает сессию</span>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
